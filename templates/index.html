<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Command Runner</title>

<style>
body {
    font-family: system-ui, sans-serif;
    background: #f6f7f9;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

input[type=text] {
    width: 100%;
    padding: 10px;
    font-family: monospace;
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    height: 300px;
    padding: 10px;
    font-family: monospace;
    background: #111;
    color: #0f0;
}

button {
    padding: 8px 12px;
    margin-right: 6px;
    cursor: pointer;
}

.run {
    background: #2563eb;
    color: white;
    border: none;
}
</style>
</head>

<body>
<div class="container">
    <h1>Command Runner</h1>

    <div class="presets">
        <button onclick="setCmd('python load.py --foo --bar --baz')">Load</button>
        <button onclick="setCmd('python rag.py')">RAG</button>
        <button onclick="setCmd('python test.py')">Test</button>
    </div>

    <input id="cmd" type="text" placeholder="Enter command..." />

    <button class="run" onclick="run()">Run</button>

    <textarea id="output" readonly></textarea>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
