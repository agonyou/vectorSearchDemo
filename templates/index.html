<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Command Runner</title>

<style>
body {
    font-family: system-ui, sans-serif;
    background: #f6f7f9;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

input[type=text] {
    width: 100%;
    padding: 10px;
    font-family: monospace;
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    height: 300px;
    padding: 10px;
    font-family: monospace;
    background: #111;
    color: #0f0;
}

button {
    padding: 8px 12px;
    margin-right: 6px;
    cursor: pointer;
}

.run {
    background: #2563eb;
    color: white;
    border: none;
}

.tabs input[type="radio"] {
  display: none;
}

.tabs label {
  padding: 0.5rem 1rem;
  cursor: pointer;
  background: #ddd;
}

.tabs input:checked + label {
  background: #fff;
  border-bottom: 2px solid #000;
}

.content section {
  display: none;
  padding: 1rem;
  border: 1px solid #ccc;
}

#tab1:checked ~ .content #content1,
#tab2:checked ~ .content #content2,
#tab3:checked ~ .content #content3 {
  display: block;
}

</style>
</head>

<body>
<div class="container">
    <h1>Couchbase Vector Search Demo</h1>

    <div class="tabs">
    <input type="radio" name="tabs" id="tab1" checked>
    <label for="tab1">Composite</label>

    <input type="radio" name="tabs" id="tab2">
    <label for="tab2">Hyperscale</label>

    <input type="radio" name="tabs" id="tab3">
    <label for="tab3">Hybrid (FTS)</label>

    <div class="content">
        <section id="content1">
            <button onclick="setCmd('python load.py --foo --bar --baz')">Load</button>
        </section>

        <section id="content2">
             <button onclick="setCmd('python rag.py')">RAG</button>
        </section>

        <section id="content3">
            <button onclick="setCmd('python test.py')">Test</button>
        </section>
    </div>
    </div>

    <input id="cmd" type="text" placeholder="Enter command..." />

    <button class="run" onclick="run()">Run</button>

    <textarea id="output" readonly></textarea>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
